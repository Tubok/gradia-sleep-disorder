name: Deploy Go Backend to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - "backend-go/**"
      - "fly.toml"
      - ".github/workflows/deploy-go.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --config fly.toml --dockerfile backend-go/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
